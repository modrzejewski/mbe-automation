[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mbe-automation"
version = "0.4.2"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.8.0",
  "numpy==2.3.3",
  "scipy==1.16.2",
  "networkx",
  "ase>=3.26.0",
  "dscribe",
  "matplotlib",
  "pymatgen==2026.10.24",
  "pymatgen-core==2026.10.31",
  "pymatgen-analysis-defects==2026.10.24",
  "monty==2026.10.21",
  "pyscf>=2.12.0",
  "pyscf-dispersion",
  "scikit-learn",
  "spglib==2.6.0",
  "seekpath==2.2.1",
  "euphonic",
  "phonopy==2.43.2",
  "symfc==1.6.1",
  "tqdm",
  "joblib",
  "h5py",
  "pandas",
  "doped==3.2.1",
  "dynasor",
  "nglview",
  "pymatviz",
  "chemiscope",
  "gemmi",
  "irmsd==0.1.1",
]

[project.optional-dependencies]

mace = [
  "mace-torch>=0.3.17",
]
uma = [
  "fairchem-core>=2.26.0",
]
# For CUDA 12.X environments
gpu-cuda12 = [
  "cuequivariance",
  "cuequivariance-torch",
  "cuequivariance-ops-torch-cu12",
  "gpu4pyscf-cuda12x>=1.9.2",
  "cutensor-cu12",
  "ray",
]

[tool.setuptools.package-data]
mbe_automation = ["templates/**/*"]
